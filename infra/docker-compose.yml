version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: skilllens-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-skilllens_secret_password}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-skilllens}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - skilllens-net

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    container_name: skilllens-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - MONGODB_URL=mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-skilllens_secret_password}@mongodb:27017/${MONGO_DB_NAME:-skilllens}?authSource=admin
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-demo_jwt_secret_key_change_in_production_min32chars}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ../apps/api:/app/apps/api
      - ../data/esco:/app/data/esco
      - uploads_data:/app/uploads
    networks:
      - skilllens-net

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    container_name: skilllens-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api
    volumes:
      - ../apps/web:/app/apps/web
      - ../packages/shared:/app/packages/shared
    networks:
      - skilllens-net

volumes:
  mongodb_data:
  uploads_data:

networks:
  skilllens-net:
    driver: bridge
